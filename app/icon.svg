<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
<title id="title">Nook — overlapping colours</title>
<defs>
  <path id="coral" d="M46 149L266 82Q274 80 275 88L301 341Q302 347 296 351L139 448Q133 452 132 446L42 157Q40 151 46 149Z"/>
  <path id="gold" d="M220 41Q222 34 228 36L431 92Q436 93 435 99L395 343Q394 348 388 346L157 303Q151 302 153 296Z"/>
  <path id="blue" d="M186 452C193 365 205 266 223 225C236 192 256 179 283 178C328 175 384 194 415 216C454 244 475 291 475 329C477 369 461 390 428 407C379 438 269 456 198 463Q184 465 186 452Z"/>
  <clipPath id="in-coral"><use href="#coral"/></clipPath>
  <clipPath id="in-gold"><use href="#gold"/></clipPath>
  <linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#FFFCF4"/><stop offset="1" stop-color="#F8F0DE"/></linearGradient>
  <linearGradient id="coral-ink" x2="0.3" y2="1"><stop stop-color="#FF9077"/><stop offset="1" stop-color="#FF7E68"/></linearGradient>
  <linearGradient id="gold-ink" x2="0.5" y2="1"><stop stop-color="#FFC23E"/><stop offset="1" stop-color="#FFDC76"/></linearGradient>
  <linearGradient id="blue-ink" x2="0.4" y2="1"><stop stop-color="#95A6FF"/><stop offset="1" stop-color="#8196F4"/></linearGradient>
  <linearGradient id="green-ink" x2="0.4" y2="1"><stop stop-color="#789D85"/><stop offset="1" stop-color="#3E7F9F"/></linearGradient>
  <linearGradient id="plum-ink" x2="0.4" y2="1"><stop stop-color="#A54C59"/><stop offset="1" stop-color="#725496"/></linearGradient>
</defs>
<rect width="512" height="512" rx="96" fill="url(#paper)"/>
<use href="#coral" fill="url(#coral-ink)"/>
<use href="#gold" fill="url(#gold-ink)"/>
<use href="#gold" clip-path="url(#in-coral)" fill="#FF8A3B"/>
<use href="#blue" fill="url(#blue-ink)"/>
<use href="#blue" clip-path="url(#in-gold)" fill="url(#green-ink)"/>
<use href="#blue" clip-path="url(#in-coral)" fill="#8562AA"/>
<g clip-path="url(#in-coral)"><use href="#blue" clip-path="url(#in-gold)" fill="url(#plum-ink)"/></g>
</svg>
